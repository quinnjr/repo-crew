name: CI

# The five gates (pnpm check / lint / lint:rust / test / build) previously ran
# only on a developer's machine. They run here on every integration push and
# every pull request instead.
on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Gates (Linux)
    runs-on: ubuntu-latest
    env:
      # Supplied so the *configured* compile-time credential path
      # (`option_env!` present) is what gets built and clippy'd. When the
      # secrets are absent — forks, or a repo without them set — these expand
      # to the empty string, GitHub Actions drops empty env vars from the
      # process environment, and the build takes the unconfigured
      # `option_env!() == None` branch. Both paths must stay green, so a fork
      # without secrets still gets a passing CI run.
      REPO_CREW_GH_CLIENT_ID: ${{ secrets.REPO_CREW_GH_CLIENT_ID }}
      REPO_CREW_GH_CLIENT_SECRET: ${{ secrets.REPO_CREW_GH_CLIENT_SECRET }}
      REPO_CREW_GH_APP_SLUG: ${{ secrets.REPO_CREW_GH_APP_SLUG }}
    steps:
      - uses: actions/checkout@v4

      # Tauri v2 on Linux: webkit2gtk 4.1 (not 4.0), plus the tray/icon and
      # xdotool dependencies the Tauri crates link against.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            build-essential \
            file \
            patchelf \
            pkg-config \
            wget

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # Version comes from the "packageManager" field in package.json.
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: pnpm check
        run: pnpm check

      - name: pnpm lint
        run: pnpm lint

      - name: pnpm lint:rust
        run: pnpm lint:rust

      - name: pnpm test
        run: pnpm test

      - name: pnpm build
        run: pnpm build
